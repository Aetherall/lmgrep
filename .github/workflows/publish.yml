name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Bump version and publish
        run: |
          set -e

          latest=$(npm view lmgrep "dist-tags.latest" 2>/dev/null || echo "0.0.0")
          declared=$(node -p "require('./package.json').version")

          # A version written into package.json wins when it is ahead of what
          # is published; otherwise the patch series continues from the
          # registry. Without this the awk bump silently overwrote a
          # deliberate major or minor bump with latest+1, so a breaking
          # release could only ever ship as a patch.
          highest=$(printf '%s\n%s\n' "$latest" "$declared" | sort -V | tail -1)
          if [ "$highest" = "$latest" ]; then
            next=$(echo "$latest" | awk -F'[.-]' '{ print $1 "." $2 "." $3+1 }')
          else
            next="$declared"
          fi

          echo "Latest: $latest  Declared: $declared -> Next: $next"
          npm pkg set version="$next"

          npm publish --provenance --access public
